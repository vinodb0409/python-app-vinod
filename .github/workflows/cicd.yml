name: Python CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install application dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Install CI tools
      - name: Install QA Tools
        run: |
          pip install pylint pytest safety

      # Code Quality Scan
      - name: Run Pylint
        run: |
          pylint *.py

      # Unit Tests
      - name: Run Pytest
        run: |
          pytest tests/ -v

      # Dependency Vulnerability Scan
      - name: Safety Scan
        run: |
          safety check

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t python-demo:${{ github.sha }} .

      # Scan Docker Image
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-demo:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # Upload artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: .
`
